# デモモードのリリース APK を Android エミュレーターで動かす E2E(Maestro)。
# 時間がかかるので main への push でだけ動かす。Secrets は使わない
name: E2E

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # CI では .env がないので、mise.toml だけを信頼する
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # ランナーのエミュレーターは x86_64。配布用の設定の arm64-v8a では動かない
  E2E_ABI: x86_64

jobs:
  e2e:
    name: エミュレーターの E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise.toml の Java と Maestro を入れる。Android SDK はランナーのものを使う
      - uses: ./.github/actions/setup
        with:
          mise-cache-prefix: mise-v1-e2e
      - name: Gradle のキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-e2e-${{ runner.os }}-
      - run: mise run e2e:build
      - name: KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: mise run e2e:test
      - name: 失敗したときの画面と記録を残す
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e/output/results
          retention-days: 7
