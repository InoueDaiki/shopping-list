# 署名済みの arm64 のリリース APK をビルドし、Actions の artifact に置く。
# - バージョンタグ(v1.2.3): 普段使いの版。タグの版を versionName にする
# - workflow_dispatch: 任意のブランチの確認用の版。版は 0.0.0-dev.<実行番号>
# versionCode は実行番号。このファイルの名前を変えると番号が振り直されるので変えない
# 配布物を作るので、Actions のキャッシュは読み書きしない
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # Maestro は E2E にだけ使う
  MISE_DISABLE_TOOLS: maestro

jobs:
  release:
    name: リリース APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      # Secrets は使うステップの env だけに渡す。依存関係の導入などには見せない
      - name: Secrets を確かめる
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_OAUTH_CLIENT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Secrets が足りません::${missing[*]} を設定してください。手順は README の「配布」を参照"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mise-cache-prefix: mise-v1-release
          cache: "false"

      - name: 版と鍵を用意する
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.$GITHUB_RUN_NUMBER"
          fi
          keystore="$RUNNER_TEMP/release.jks"
          base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > "$keystore"
          {
            echo "APP_VERSION=$version"
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "APK_PATH=$RUNNER_TEMP/shopping-list-$version-arm64.apk"
          } >> "$GITHUB_ENV"

      - run: mise run build:android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}

      - name: 署名を確かめる
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$APK_PATH"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$APK_PATH"

      # archive: false では zip せず APK のまま置く。artifact の名前はファイル名になる
      # 保持の 90 日は public のリポジトリの上限。overwrite は同じ実行の再実行のため
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.APK_PATH }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 90
